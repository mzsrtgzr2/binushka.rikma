name: checkout smoke

# Opens a real payment form every 30 minutes. If the checkout endpoint crashes,
# the run fails and GitHub mails the repo owner — days before a shopper has to
# write in about it. Opening a form is free; nothing is charged or reserved.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Drill: fail on purpose to test the Discord alert (no site traffic, no charge)'
        type: boolean
        default: false
  # Self-test whenever this file changes, so a broken monitor cannot go quiet.
  push:
    paths:
      - .github/workflows/checkout-smoke.yml

concurrency:
  group: checkout-smoke
  cancel-in-progress: true

jobs:
  payment-form:
    name: payment form opens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/checkout and expect a payment url
        run: |
          set -euo pipefail
          body='{"items":[{"id":"birth-hoop","quantity":1}],"shipping":"pickup","firstName":"בדיקת","lastName":"תשלום","phone":"0501234567","email":"smoke-test@example.com"}'
          code=$(curl -sS --max-time 45 -o /tmp/checkout.json -w '%{http_code}' \
            -X POST 'https://rikma.binushka.com/api/checkout/' \
            -H 'Content-Type: application/json' \
            -d "$body")
          echo "status=$code"
          cat /tmp/checkout.json || true
          if [ "$code" != "200" ]; then
            echo "::error::checkout returned HTTP $code"
            exit 1
          fi
          if ! grep -q '"url"' /tmp/checkout.json; then
            echo '::error::no payment url in the response'
            exit 1
          fi

      - name: payment settings are present
        run: |
          set -euo pipefail
          curl -sS --max-time 30 'https://rikma.binushka.com/api/checkout/' -o /tmp/status.json
          cat /tmp/status.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/status.json'))
          missing = [k for k in ('hasKeyId', 'hasSecret', 'hasPluginId') if not d.get(k)]
          if missing:
              print(f"::error::missing payment settings: {missing}")
              sys.exit(1)
          print('settings ok, env =', d.get('env'))
          PY

      - name: drill — simulate a checkout failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo '::error::DRILL: intentional failure to test the Discord alert'
          exit 1

      - name: alert discord when the check failed
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRILL: ${{ inputs.simulate_failure }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo 'no DISCORD_WEBHOOK_URL secret; skipping alert'
            exit 0
          fi
          prefix=""
          if [ "${DRILL:-}" = "true" ]; then prefix="🧪 סימולציה — "; fi
          text="${prefix}🚨 בדיקת התשלום נכשלה — החנות לא הצליחה לפתוח טופס תשלום. ריצה: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(python3 -c 'import json,sys; print(json.dumps({"content": sys.argv[1][:1900]}))' "$text")
          # Discord sits behind Cloudflare: a plain python urllib POST is
          # rejected with 403 / error code 1010 from GitHub runners, so send
          # with curl and an explicit User-Agent.
          code=$(curl -sS -o /tmp/discord.out -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: rikma-checkout-smoke/1.0' \
            --data "$payload")
          echo "discord status $code"
          cat /tmp/discord.out || true
          [ "$code" = "204" ] || [ "$code" = "200" ]
