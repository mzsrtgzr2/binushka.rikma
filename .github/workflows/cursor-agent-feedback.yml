name: Cursor Agent - Feedback and Approval

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cursor-agent-feedback-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  publish-preview-to-issue:
    if: >-
      ${{
        github.event.sender.login == 'vercel[bot]' &&
        github.event.issue.pull_request
      }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Publish Vercel preview on original issue
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          comment_file="$RUNNER_TEMP/vercel-comment.md"
          pr_body_file="$RUNNER_TEMP/pr-body.md"
          jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" > "$comment_file"
          gh pr view "$PR_NUMBER" --json body --jq '.body // ""' > "$pr_body_file"

          issue_number="$(python3 - "$pr_body_file" <<'PY'
          import re
          import sys

          body = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"cursor-agent-task:\s*issue-(\d+)", body)
          print(match.group(1) if match else "")
          PY
          )"

          preview_url="$(python3 - "$comment_file" <<'PY'
          import re
          import sys

          body = open(sys.argv[1], encoding="utf-8").read()
          match = re.search(r"\[Preview\]\((https://[^)\s]+)\)", body)
          if not match:
              match = re.search(r"https://[^\s)<>\"']+\.vercel\.app[^\s)<>\"']*", body)
          print(match.group(1) if match else "")
          PY
          )"

          if [ -z "$issue_number" ] || [ -z "$preview_url" ]; then
            exit 0
          fi

          reply_file="$RUNNER_TEMP/vercel-preview-reply.md"
          {
            echo "<!-- cursor-agent-status -->"
            echo "Vercel preview is ready:"
            echo
            echo "$preview_url"
            echo
            echo "Please review that preview, then keep commenting in this issue with requested tweaks. When it looks good, comment \`/approve\` here."
          } > "$reply_file"

          gh issue comment "$issue_number" --body-file "$reply_file"

  handle-comment:
    if: >-
      ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Authorize commenter
        id: auth
        env:
          CURSOR_AGENT_ALLOWED_USERS: ${{ vars.CURSOR_AGENT_ALLOWED_USERS }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re

          commenter = os.environ["COMMENTER"].strip().lower()
          allowed_raw = os.environ.get("CURSOR_AGENT_ALLOWED_USERS") or os.environ["REPOSITORY_OWNER"]
          allowed = {
              user.strip().lower()
              for user in re.split(r"[\s,]+", allowed_raw)
              if user.strip()
          }

          print(f"authorized={'true' if commenter in allowed else 'false'}")
          PY

      - name: Resolve Cursor PR and requested action
        if: steps.auth.outputs.authorized == 'true'
        id: context
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          ISSUE_OR_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          comment_file="$RUNNER_TEMP/cursor-comment.md"
          pr_file="$RUNNER_TEMP/cursor-pr.json"
          jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH" > "$comment_file"

          if grep -Fq '<!-- cursor-agent-status -->' "$comment_file"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -Eiq '(^|[[:space:]])/approve([[:space:]]|$)' "$comment_file"; then
            action="approve"
          else
            action="feedback"
          fi

          is_pr="$(jq -r '(.issue.pull_request != null)' "$GITHUB_EVENT_PATH")"
          if [ "$is_pr" = "true" ]; then
            if ! gh pr view "$ISSUE_OR_PR_NUMBER" \
              --json number,url,headRefName,baseRefName,body,state,labels,title,isCrossRepository \
              > "$pr_file"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            is_task_issue="$(jq -r '([.issue.labels[].name] | index("cursor-task")) != null' "$GITHUB_EVENT_PATH")"
            if [ "$is_task_issue" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            branch="cursor/issue-${ISSUE_OR_PR_NUMBER}"
            if ! gh pr list \
              --state open \
              --head "$branch" \
              --json number,url,headRefName,baseRefName,body,state,labels,title,isCrossRepository \
              --jq '.[0] // empty' > "$pr_file"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ ! -s "$pr_file" ]; then
              no_pr_reply="$RUNNER_TEMP/cursor-no-pr-reply.md"
              {
                echo "<!-- cursor-agent-status -->"
                echo "I could not find an open Cursor pull request for this task yet."
              } > "$no_pr_reply"

              gh issue comment "$ISSUE_OR_PR_NUMBER" --body-file "$no_pr_reply"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Anyone can open a PR whose body mentions the task marker, so only
          # trust PRs this automation opened: same-repo head branch, the
          # automation's branch prefix, and the label (which needs write access).
          is_cursor_pr="$(jq -r '
            (.isCrossRepository == false) and
            ([.labels[].name] | index("cursor-agent") != null) and
            (.headRefName | test("^cursor/issue-[0-9]+$"))
          ' "$pr_file")"

          if [ "$is_cursor_pr" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_state="$(jq -r '.state' "$pr_file")"
          if [ "$pr_state" != "OPEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "comment_file=${comment_file}" >> "$GITHUB_OUTPUT"
          echo "thread_number=${ISSUE_OR_PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "pr_number=$(jq -r '.number' "$pr_file")" >> "$GITHUB_OUTPUT"
          echo "pr_url=$(jq -r '.url' "$pr_file")" >> "$GITHUB_OUTPUT"
          echo "branch=$(jq -r '.headRefName' "$pr_file")" >> "$GITHUB_OUTPUT"
          echo "base_branch=$(jq -r '.baseRefName' "$pr_file")" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.title | gsub("[\\r\\n]"; " ")' "$pr_file")" >> "$GITHUB_OUTPUT"

      - name: Acknowledge feedback
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          THREAD_NUMBER: ${{ steps.context.outputs.thread_number }}
        run: |
          ack_reply="$RUNNER_TEMP/cursor-feedback-ack.md"
          {
            echo "<!-- cursor-agent-status -->"
            echo "Cursor received this feedback and is working on an update now."
          } > "$ack_reply"

          gh issue comment "$THREAD_NUMBER" --body-file "$ack_reply"

      - name: Merge approved pull request
        id: merge
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_URL: ${{ steps.context.outputs.pr_url }}
          THREAD_NUMBER: ${{ steps.context.outputs.thread_number }}
        run: |
          set -euo pipefail

          merged=false
          needs_resolution=false
          merge_log="$RUNNER_TEMP/cursor-merge.log"

          if gh pr merge "$PR_NUMBER" --squash --auto --delete-branch >"$merge_log" 2>&1; then
            merged=true
            approve_reply="$RUNNER_TEMP/cursor-approve-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Approval received. Auto-merge is enabled for $PR_URL and will complete when GitHub allows the pull request to merge."
            } > "$approve_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$approve_reply"
          elif grep -Eiq "Protected branch rules not configured|Pull request is in clean status" "$merge_log"; then
            immediate_merge_log="$RUNNER_TEMP/cursor-immediate-merge.log"
            if gh pr merge "$PR_NUMBER" --squash --delete-branch >"$immediate_merge_log" 2>&1; then
              merged=true
              approve_reply="$RUNNER_TEMP/cursor-approve-immediate-reply.md"
              {
                echo "<!-- cursor-agent-status -->"
                echo "Approval received. GitHub auto-merge was not available for this PR, so I squash-merged $PR_URL now."
              } > "$approve_reply"

              gh issue comment "$THREAD_NUMBER" --body-file "$approve_reply"
            elif grep -Eiq "conflict|not mergeable|must be resolved|mergeable state" "$immediate_merge_log"; then
              needs_resolution=true
            else
              approve_failure_reply="$RUNNER_TEMP/cursor-approve-failure-reply.md"
              {
                echo "<!-- cursor-agent-status -->"
                echo "Approval received, but I could not merge the pull request."
                echo
                echo "GitHub CLI output:"
                echo '```'
                cat "$immediate_merge_log"
                echo '```'
              } > "$approve_failure_reply"

              gh issue comment "$THREAD_NUMBER" --body-file "$approve_failure_reply"
              exit 1
            fi
          elif grep -Eiq "conflict|not mergeable|must be resolved|mergeable state" "$merge_log"; then
            needs_resolution=true
          else
            approve_failure_reply="$RUNNER_TEMP/cursor-approve-failure-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Approval received, but I could not enable auto-merge or merge the pull request."
              echo
              echo "GitHub CLI output:"
              echo '```'
              cat "$merge_log"
              echo '```'
            } > "$approve_failure_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$approve_failure_reply"
            exit 1
          fi

          if [ "$needs_resolution" = "true" ]; then
            approve_reply="$RUNNER_TEMP/cursor-approve-immediate-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Approval received, but GitHub says this pull request has merge conflicts. Cursor will try to resolve the conflicts and merge again."
            } > "$approve_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$approve_reply"
          fi

          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "needs_resolution=$needs_resolution" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request branch for conflict resolution
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve' && steps.merge.outputs.needs_resolution == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB || github.token }}
          ref: ${{ steps.context.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cursor CLI for conflict resolution
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve' && steps.merge.outputs.needs_resolution == 'true'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Merge base branch for conflict resolution
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve' && steps.merge.outputs.needs_resolution == 'true'
        id: conflict_merge
        env:
          BASE_BRANCH: ${{ steps.context.outputs.base_branch }}
        run: |
          set -euo pipefail

          git config user.name "Cursor Agent Bot"
          git config user.email "cursor-agent-bot@users.noreply.github.com"
          git fetch origin "$BASE_BRANCH"

          set +e
          git merge --no-edit "origin/$BASE_BRANCH"
          merge_exit=$?
          set -e

          if [ "$merge_exit" -eq 0 ]; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve merge conflicts with Cursor
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve' && steps.merge.outputs.needs_resolution == 'true' && steps.conflict_merge.outputs.has_conflicts == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'auto' }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_URL: ${{ steps.context.outputs.pr_url }}
          PR_TITLE: ${{ steps.context.outputs.title }}
          BASE_BRANCH: ${{ steps.context.outputs.base_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          model="$CURSOR_MODEL"
          if [ "$model" = "gpt-5" ]; then
            echo "::warning::Cursor CLI does not offer model 'gpt-5' for this account; falling back to 'auto'."
            model="auto"
          fi

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          prompt_file="$RUNNER_TEMP/cursor-conflict-prompt.md"
          {
            echo "You are Cursor Agent working in repository ${REPOSITORY}."
            echo
            echo "Pull request: #${PR_NUMBER} - ${PR_TITLE}"
            echo "PR URL: ${PR_URL}"
            echo "Base branch: ${BASE_BRANCH}"
            echo
            echo "The PR was approved, but merging ${BASE_BRANCH} into the PR branch produced merge conflicts."
            echo "Resolve all conflict markers and make the final code satisfy both the PR intent and the current base branch."
            echo
            echo "Conflicted files:"
            echo '---'
            printf '%s\n' "$conflicts"
            echo '---'
            echo
            echo "Do not create, merge, or update pull requests yourself; the GitHub Action will commit, push, and retry the merge after you finish."
          } > "$prompt_file"

          agent -p "$(cat "$prompt_file")" \
            --model "$model" \
            --force \
            --trust \
            --output-format text

      - name: Commit and push conflict resolution
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve' && steps.merge.outputs.needs_resolution == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          BRANCH_NAME: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          THREAD_NUMBER: ${{ steps.context.outputs.thread_number }}
        run: |
          set -euo pipefail

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$unresolved" ]; then
            unresolved_reply="$RUNNER_TEMP/cursor-unresolved-conflicts-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Cursor tried to resolve the merge conflicts, but these files still have unresolved conflicts:"
              echo
              printf '%s\n' "$unresolved"
            } > "$unresolved_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$unresolved_reply"
            exit 1
          fi

          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "fix(cursor): resolve merge conflicts for PR #${PR_NUMBER}"
          fi

          gh auth setup-git
          git push origin "$BRANCH_NAME"

      - name: Retry merge after conflict resolution
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'approve' && steps.merge.outputs.needs_resolution == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_URL: ${{ steps.context.outputs.pr_url }}
          THREAD_NUMBER: ${{ steps.context.outputs.thread_number }}
        run: |
          set -euo pipefail

          retry_merge_log="$RUNNER_TEMP/cursor-retry-merge.log"
          if gh pr merge "$PR_NUMBER" --squash --delete-branch >"$retry_merge_log" 2>&1; then
            retry_reply="$RUNNER_TEMP/cursor-conflict-merge-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Cursor resolved the merge conflicts and squash-merged $PR_URL."
            } > "$retry_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$retry_reply"
          else
            retry_failure_reply="$RUNNER_TEMP/cursor-conflict-merge-failure-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Cursor resolved the conflicts and pushed an update, but GitHub still would not merge the PR."
              echo
              echo "GitHub CLI output:"
              echo '```'
              cat "$retry_merge_log"
              echo '```'
            } > "$retry_failure_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$retry_failure_reply"
            exit 1
          fi

      - name: Checkout pull request branch
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB || github.token }}
          ref: ${{ steps.context.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cursor CLI
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

      - name: Build feedback prompt
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        id: prompt
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          PR_URL: ${{ steps.context.outputs.pr_url }}
          PR_TITLE: ${{ steps.context.outputs.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          prompt_file="$RUNNER_TEMP/cursor-feedback-prompt.md"

          {
            echo "You are Cursor Agent continuing work in repository ${REPOSITORY}."
            echo
            echo "Pull request: #${PR_NUMBER} - ${PR_TITLE}"
            echo "PR URL: ${PR_URL}"
            echo
            echo "The reviewer left this follow-up request:"
            echo '---'
            cat "${{ steps.context.outputs.comment_file }}"
            echo '---'
            echo
            echo "Apply the requested update directly to the current pull request branch."
            echo "Keep changes focused on the feedback and preserve the rest of the PR."
            echo "Do not create, merge, or update pull requests yourself; the GitHub Action will commit and push after you finish."
          } > "$prompt_file"

          echo "file=${prompt_file}" >> "$GITHUB_OUTPUT"

      - name: Run Cursor Agent on feedback
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'auto' }}
        run: |
          set -euo pipefail
          model="$CURSOR_MODEL"
          if [ "$model" = "gpt-5" ]; then
            echo "::warning::Cursor CLI does not offer model 'gpt-5' for this account; falling back to 'auto'."
            model="auto"
          fi

          agent -p "$(cat "${{ steps.prompt.outputs.file }}")" \
            --model "$model" \
            --force \
            --trust \
            --output-format text

      - name: Commit and push feedback changes
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        id: commit
        env:
          BRANCH_NAME: ${{ steps.context.outputs.branch }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
        run: |
          set -euo pipefail

          git config user.name "Cursor Agent Bot"
          git config user.email "cursor-agent-bot@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "fix(cursor): address feedback on PR #${PR_NUMBER}"
          gh auth setup-git
          git push origin "$BRANCH_NAME"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Reply with feedback result
        if: steps.auth.outputs.authorized == 'true' && steps.context.outputs.skip != 'true' && steps.context.outputs.action == 'feedback'
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB || github.token }}
          THREAD_NUMBER: ${{ steps.context.outputs.thread_number }}
          HAS_CHANGES: ${{ steps.commit.outputs.has_changes }}
        run: |
          set -euo pipefail

          if [ "$HAS_CHANGES" = "true" ]; then
            update_reply="$RUNNER_TEMP/cursor-update-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Cursor pushed an update for this feedback. Vercel should rebuild the preview shortly and I will post the new preview link here when it is ready."
            } > "$update_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$update_reply"
          else
            no_changes_reply="$RUNNER_TEMP/cursor-feedback-no-changes-reply.md"
            {
              echo "<!-- cursor-agent-status -->"
              echo "Cursor ran on this feedback, but it did not produce any repository changes. Please add more detail if another adjustment is needed."
            } > "$no_changes_reply"

            gh issue comment "$THREAD_NUMBER" --body-file "$no_changes_reply"
          fi
