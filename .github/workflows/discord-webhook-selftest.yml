name: discord webhook self-test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/discord-webhook-selftest.yml
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: post with curl UA
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          [ -n "${WEBHOOK:-}" ] || { echo 'MISSING SECRET'; exit 2; }
          code=$(curl -sS -o /tmp/wh.out -w '%{http_code}' -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: rikma-checkout-smoke/1.0' \
            -d '{"content":"✅ בדיקת webhook מהתהליך — החיבור עובד."}')
          echo "discord status $code"
          head -c 200 /tmp/wh.out || true
          [ "$code" = "204" ] || [ "$code" = "200" ]
