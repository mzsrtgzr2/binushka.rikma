name: discord webhook self-test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/discord-webhook-selftest.yml
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: post a test message
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo 'MISSING SECRET'; exit 2; fi
          python3 - "$WEBHOOK" <<'PY'
          import json, sys, urllib.request
          body = json.dumps({'content': '✅ בדיקת webhook מהתהליך — החיבור עובד.'}).encode()
          req = urllib.request.Request(sys.argv[1], data=body, headers={'Content-Type': 'application/json'})
          with urllib.request.urlopen(req, timeout=20) as res:
              print('discord status', res.status)
          PY
