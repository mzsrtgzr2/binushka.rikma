# Hebrew month names for workshop list filters on /projects/.
# Keys are zero-padded month numbers matching Liquid `date: '%m'`.
# The workshops page shows only the next 4 months from "now"; this map
# supplies labels (and wraps past December).
"01": ינואר
"02": פברואר
"03": מרץ
"04": אפריל
"05": מאי
"06": יוני
"07": יולי
"08": אוגוסט
"09": ספטמבר
"10": אוקטובר
"11": נובמבר
"12": דצמבר
