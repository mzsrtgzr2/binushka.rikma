# Fixed-price store items that can go in the cart.
# Gift cards are variable-price: the customer picks an amount, checkout
# sends that sum to Morning (no catalog itemId).
# Scrunchies have three fixed variants; checkout sends a server-checked
# variant id (never a client price) plus an optional fabric note.
# morning_item_id is the Green Invoice / Morning catalog UUID.
# price is a fallback if the Morning item list cannot be loaded.
# Live prices come from Morning → פריטים.

enabled: true
success_path: "/thanks/"
free_shipping_min: 250

shipping:
