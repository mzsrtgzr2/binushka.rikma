# FAQ accordion on workshop pages (/projects/...).
# Matched by page.faq_category, else by page.category
# (with pampering mothers mornings auto-routed — see workshop-faq.html).
# Optional per-page front matter:
#   accordion: [...]     — full override (same shape as homepage)
#   faq_category: <key>  — pick a set from categories below
#   hide_faq: true       — skip the FAQ block
#
# Event types (keep aligned with workshop-testimonials.yml):
#   mothers         — קורס רקמה אמהות רוקמות (עם תינוקות)
#   mothers-pamper  — בוקר פינוק לאמהות (הרצאת מנחת חוץ + בראנץ׳)
#   mothers-no-kids — מפגש אמהות במפורש בלי ילדים
#   all-levels      — סדנת רקמה לכל הרמות
#   advanced        — חוג רקמה למנוסות
#   beginners       — סדנאות למתחילות (למשל קרושה)
#   hosting         — סדנת אירוח / אפייה
#   private         — סדנה פרטית (מחיר לסדנה)

categories:
  mothers:
    - title: האם אפשר להגיע עם התינוק?
      content: כן כמובן, יש משטח פעילות לתינוקות.
    - title: האם נדרש ידע מקדים ברקמה?
      content: לא. לומדות הכול בסדנה בנחת ובסבלנות. כל החומרים כלולים — מביאות את עצמכן ואת התינוק.
    - title: כמה מפגשים יש בקורס?
      content: ארבעה מפגשים של שעתיים וחצי כל אחד, עם ארוחת בוקר וקבוצת וואטספ להמשך.
    - title: מה כולל המחיר?
      content: ערכת רקמה אישית, ארוחת בוקר מפנקת בכל מפגש, וקבוצת וואטספ אינטימית למשתתפות.
    - title: לא מוזר להגיע לבד?
      content: לא. רוב המשתתפות מגיעות לבד, ונרקמת קבוצה חמה של אמהות בחל״ד.
    - title: מה מדיניות הביטול?
      content: בהתאם ל[תקנון ותנאי הביטול של קורס אמהות רוקמות](/terms/).

  mothers-pamper:
    - title: האם אפשר להגיע עם התינוק?
      content: כן כמובן, יש משטח פעילות לתינוקות. אפשר להביא תינוקות עד גיל זחילה כולל; גיל עמידה והליכה לא מתאים.
    - title: זו סדנת רקמה?
      content: לא. זה בוקר פינוק עם בראנץ׳ מפנק ומנחה אורחת — שיח, כלים ואווירה, בלי רקמה.
    - title: מה כולל המחיר?
      content: ארוחת בוקר מפנקת מעשה ידיי, הנחיה של אשת מקצוע, וקבוצת וואטספ אינטימית למשתתפות המפגש.
    - title: אפשר להירשם ביחד עם חברה?
      content: כן. יש אפשרות להרשמה זוגית במחיר מוזל — פרטים בדף ההרשמה.
    - title: לא מוזר להגיע לבד?
      content: לא. רוב האמהות מגיעות לבד, והמעגל נועד בדיוק לפגוש עוד אמהות בחל״ד.
    - title: מה מדיניות הביטול?
      content: אפשר לבטל לפי [התקנון ותנאי הביטול](/terms/).

  mothers-no-kids:
    - title: האם אפשר להגיע עם תינוק או ילדים?
      content: לא בפעם הזו — המפגש במפורש בלי ילדים, כדי שתוכלו לקחת אוויר באמת.
    - title: צריך ניסיון ביצירה או ברקמה?
      content: ממש לא. יש שולחן יצירה עמוס בחומרים — בוחרות מה שמושך ומתחילות.
    - title: מה כולל המחיר?
      content: בראנץ׳ מפנק וקפה, שולחן יצירה עם חומרים, וקבוצת וואטספ למשתתפות.
    - title: לא מוזר להגיע לבד?
      content: לא. רוב המשתתפות מגיעות לבד, ונוצרים חיבורים כיפיים סביב השולחן.
    - title: מה מדיניות הביטול?
      content: אפשר לבטל לפי [התקנון ותנאי הביטול](/terms/).

  all-levels:
    - title: האם נדרש ידע מקדים ברקמה?
      content: לא. לומדות הכול בסדנה בנחת ובסבלנות — מתחילות לצד מי שכבר רקמה.
    - title: מה כולל מחיר הסדנה?
      content: כל החומרים ליצירת רקמה ייחודית, כיבוד שאני מכינה, וכניסה לקבוצת וואטסאפ לליווי ושאלות.
    - title: לאילו גילאים מיועדת הסדנה?
      content: מגיל 14 ומעלה.
    - title: למדתי פעם לרקום, יש מה לחדש לי?
      content: תמיד יש מה ללמוד. גם מי שרקמה בעבר מגלה תכים חדשים וחוויות נוספות.
    - title: לא מוזר להגיע לבד לסדנה?
      content: לא. רוב המשתתפות מגיעות לבד, ונוצרים חיבורים כיפיים בין כולם.
    - title: אפשר לתת את הסדנה כמתנה?
      content: בטח! ציינו זאת בהערות בהרשמה, ואפיק שובר מתנה.
    - title: מה מדיניות הביטול?
      content: אפשר לבטל לפי [התקנון ותנאי הביטול](/terms/).

  beginners:
    - title: האם נדרש ניסיון קודם?
      content: לא. הסדנה מתאימה למי שמתנסה בפעם הראשונה, וגם למי שניסתה קצת ורוצה ללמוד בצורה מסודרת.
    - title: מה כולל המחיר?
      content: כל החומרים ליצירה, כיבוד מעשה ידיי וקפה, והדרכה צמודה לאורך הסדנה.
    - title: יוצאים עם משהו הביתה?
      content: כן — יוצרות בסדנה ולוקחות הביתה את מה שהכנתן, יחד עם הידע להמשיך בבית.
    - title: לא מוזר להגיע לבד?
      content: לא. רוב המשתתפות מגיעות לבד, והאווירה ביתית ונעימה.
    - title: אפשר להירשם ביחד עם חברה?
      content: כן. כשיש אפשרות להרשמה זוגית — הפרטים מופיעים בדף ההרשמה.
    - title: מה מדיניות הביטול?
      content: אפשר לבטל לפי [התקנון ותנאי הביטול](/terms/).

  advanced:
    - title: למי המפגש מתאים?
      content: למי שכבר יודעת לרקום ורוצה להמשיך בחברותא, ללמוד תכים חדשים או להביא עבודה מהבית. לא מתאים למי שאין לה שום ניסיון ברקמה.
    - title: אפשר להגיע עם תינוק?
      content: ללא תינוקות מגיל זחילה ומעלה.
    - title: מה מביאים למפגש?
      content: אפשר להביא פרויקט רקמה מהבית. במקום יש חוטי DMC לשימוש, צבעי מים וכיבוד.
    - title: כמה זמן נמשך המפגש?
      content: כשעתיים — בדרך כלל 11:00–13:00.
    - title: מה מדיניות הביטול?
      content: אפשר לבטל לפי [התקנון ותנאי הביטול](/terms/).

  hosting:
    - title: מה כולל המחיר?
      content: בראנץ׳ מפנק, קפה, סדנת אפייה מעשית, מתכונים, טיפים לאירוח ולהגשה, ומאפים לקחת הביתה. כל הכלים והחומרים לאפייה מסופקים במקום.
    - title: צריך להביא כלים או חומרים?
      content: לא. כל הכלים, התבניות והחומרים מחכים במקום. אפשר להגיע עם סינר אם בא לכן, אבל זה לא חובה.
    - title: יש התחשבות באלרגיות / כשרות?
      content: המטבח ביתי. אם יש אלרגיה, רגישות או בקשת כשרות — כתבו לי מראש בהרשמה או בוואטסאפ, ונראה יחד מה אפשר להתאים. לא תמיד אפשר להבטיח מטבח נטול אלרגנים.
    - title: יש חניה?
      content: יש חניה ברחוב באזור אייזנברג, רחובות. אם מתקשות למצוא מקום — כתבו לי ואכוון.
    - title: מה מדיניות הביטול?
      content: אפשר לבטל עד 72 שעות לפני תחילת הסדנה, בהתאם ל[תקנון ותנאי הביטול](/terms/). בביטול מאוחר יותר אין החזר כספי.
    - title: מה המינימום והמקסימום של משתתפות?
      content: קיום הסדנה מותנה בהרשמת מינימום 5 משתתפות. הקבוצה קטנה — עד כ־10 משתתפות — כדי שיהיה נעים לעבוד יחד ולקבל יחס אישי.
    - title: הסדנה מתאימה גם למי שלא אופה הרבה?
      content: כן. נעבוד בקצב נעים, עם הסברים ברורים. גם מי שמארחת הרבה וגם מי שרק מתחילה למצוא את הדרך שלה במטבח — יש מה לקחת.
    - title: אפשר לבוא עם חברה או לתת כמתנה?
      content: בטח. אפשר להירשם יחד, או לרשום בהערות בהרשמה שמדובר במתנה ואכין שובר בהתאם.

  private:
    - title: איך מתאמים סדנה פרטית?
      content: כתבו לי בוואטסאפ עם תאריך מועדף, מספר משתתפות ומקום — ונתאים יחד.
    - title: האם נדרש ידע מקדים?
      content: לא. הסדנה מתאימה לכל הרמות, ממתחילות ועד מתקדמות.
    - title: מה כולל המחיר?
      content: המחיר הוא לסדנה כולה (עד מספר משתתפות שצוין בדף). כולל חומרים, כיבוד, וקבוצת וואטספ למשתתפות.
    - title: אפשר לארח אצלנו בבית?
      content: כן. אפשר לתאם סדנה אצלכן — פרטים ומיקום בתיאום מראש.
    - title: מה מדיניות הביטול?
      content: בהתאם ל[תקנון ותנאי הביטול](/terms/), בתיאום אישי לסדנה פרטית.
