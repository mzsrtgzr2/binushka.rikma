<script>
    document.addEventListener("DOMContentLoaded", function() {
        const accordionItems = document.querySelectorAll('.jekyllcodex_accordion input[type="checkbox"]');

        accordionItems.forEach(function(item) {
            item.addEventListener('change', function() {
                if (this.checked) {
                    accordionItems.forEach(function(otherItem) {
                        if (otherItem !== item) {
                            otherItem.checked = false;
                        }
                    });
                }
            });
        });
    });
</script>
{%- if include.accordion_items -%}
  {%- assign accordion_list = include.accordion_items -%}
{%- else -%}
  {%- assign accordion_list = page.accordion -%}
{%- endif -%}
<div class="accordion-wrapper">
    <ul class="jekyllcodex_accordion">
        {% for item in accordion_list %}
            <li><input id="accordion{{ forloop.index }}" type="checkbox"
                data-faq-question="{{ item.title | escape }}"
                data-faq-index="{{ forloop.index }}"
                data-faq-total="{{ accordion_list.size }}"
                data-faq-context="{{ include.context | default: page.category | default: page.title | escape }}" /><label for="accordion{{ forloop.index }}">{{ item.title }}</label><div>{{ item.content | markdownify }}</div></li>
        {% endfor %}
    </ul>
</div>
