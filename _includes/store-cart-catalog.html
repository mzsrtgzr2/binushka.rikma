{% if site.data.store-cart.enabled %}
<script type="application/json" id="store-cart-catalog">
[
{%- assign first = true -%}
{%- assign gc = site.data.store-cart -%}
{%- assign catalog = site.data.catalog -%}
{%- for item in site.store -%}
    {%- assign slug = item.slug | default: item.basename -%}
    {%- assign meta = catalog[slug] -%}
    {%- if meta and meta.enabled != false -%}
      {%- unless first -%},{%- endunless -%}
      {
        "id": {{ slug | jsonify }},
        "name": {{ item.title | jsonify }},
        "price": {{ meta.price | default: 0 }},
        "image": {{ item.image | relative_url | jsonify }},
        "url": {{ item.url | relative_url | jsonify }},
        "kind": "product",
        "requiresShipping": true,
        "outOfStock": {% if item.out_of_stock or item.stock == 0 %}true{% else %}false{% endif %},
        {%- if item.stock != nil and item.stock != "" -%}
        "stock": {{ item.stock }},
        {%- endif -%}
        "limitedStock": {% if item.limited_stock %}true{% else %}false{% endif %},
        "variable": {% if meta.variable %}true{% else %}false{% endif %},
        "minPrice": {{ meta.min_price | default: 0 }},
        "maxPrice": {{ meta.max_price | default: 0 }}
        {%- if meta.variants -%}
        ,
        "variants": {
          {%- assign vfirst = true -%}
          {%- for variant in meta.variants -%}
            {%- unless vfirst -%},{%- endunless -%}
            {{ variant[0] | jsonify }}: {
              "name": {{ variant[1].name | jsonify }},
              "price": {{ variant[1].price }},
              "image": {{ variant[1].image | relative_url | jsonify }}
            }
            {%- assign vfirst = false -%}
          {%- endfor -%}
        }
        {%- endif -%}
      }
      {%- assign first = false -%}
    {%- endif -%}
{%- endfor -%}
{%- assign workshops = site.data.workshops -%}
{%- for project in site.projects -%}
    {%- assign wslug = project.slug | default: project.basename | remove: '.md' -%}
    {%- assign wid = 'workshop-' | append: wslug -%}
    {%- assign wmeta = workshops[wid] -%}
    {%- if wmeta and wmeta.enabled != false -%}
      {%- unless first -%},{%- endunless -%}
      {
        "id": {{ wid | jsonify }},
        "name": {{ wmeta.name | jsonify }},
        "price": {{ wmeta.price | default: 0 }},
        "image": {{ project.image | relative_url | jsonify }},
        "url": {{ project.url | relative_url | jsonify }},
        "kind": "workshop",
        "requiresShipping": false,
        "stock": {% if wmeta.stock != nil %}{{ wmeta.stock }}{% else %}null{% endif %},
        "outOfStock": {% if project.registration_full or wmeta.stock == 0 %}true{% else %}false{% endif %},
        "variable": false,
        "minPrice": 0,
        "maxPrice": 0
        {%- if wmeta.variants -%}
        ,
        "variants": {{ wmeta.variants | jsonify }}
        {%- endif -%}
      }
      {%- assign first = false -%}
    {%- endif -%}
{%- endfor -%}
]
</script>
<script type="application/json" id="store-cart-shipping">
{
  "methods": {
    {%- assign sfirst = true -%}
    {%- for method in site.data.store-cart.shipping -%}
      {%- unless sfirst -%},{%- endunless -%}
      {{ method[0] | jsonify }}: { "label": {{ method[1].label | jsonify }}, "price": {{ method[1].price }} }
      {%- assign sfirst = false -%}
    {%- endfor -%}
  }
}
</script>
{% endif %}
